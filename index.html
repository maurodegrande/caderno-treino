<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Caderno de Treino — Mauro</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1c1b19">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1c1b19;
    --panel: #242220;
    --panel-2: #2b2926;
    --line: #3a3733;
    --chalk: #ede7dd;
    --chalk-dim: #b7b0a3;
    --brass: #b9895a;
    --brass-dim: #8a6a48;
    --rust: #b3543a;
    --olive: #8a9a6f;
    --radius: 3px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--chalk);
    font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: calc(28px + env(safe-area-inset-top)) 18px calc(60px + env(safe-area-inset-bottom));
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{ max-width: 760px; margin: 0 auto; }

  /* Header */
  .masthead{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom: 2px solid var(--brass);
    padding-bottom: 14px; margin-bottom: 18px;
    flex-wrap: wrap; gap: 10px;
  }
  .masthead h1{
    font-size: 1.5rem; margin:0; font-weight:700; letter-spacing: 0.2px;
  }
  .masthead .sub{
    color: var(--chalk-dim); font-size: 0.82rem; margin-top: 4px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .phase-select{
    display:flex; align-items:center; gap:8px;
    font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--chalk-dim);
  }
  .phase-select select{
    background: var(--panel); color: var(--chalk); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 5px 8px; font-family: inherit; font-size: 0.8rem;
  }

  .phase-note{
    background: var(--panel); border-left: 3px solid var(--brass);
    padding: 10px 14px; margin-bottom: 20px; font-size: 0.86rem; color: var(--chalk-dim);
    border-radius: var(--radius);
  }
  .phase-note b{ color: var(--chalk); }

  /* Day tabs */
  .tabs{ display:flex; gap:6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab{
    flex: 1 1 auto; min-width: 130px;
    background: var(--panel); border: 1px solid var(--line);
    color: var(--chalk-dim); padding: 10px 12px; border-radius: var(--radius);
    cursor: pointer; text-align:left; font-family: inherit;
  }
  .tab .letter{ font-family:'IBM Plex Mono',monospace; color: var(--brass); font-weight:600; font-size:0.78rem; }
  .tab .label{ display:block; font-size: 0.88rem; margin-top:2px; color: var(--chalk); font-weight: 600; }
  .tab.active{ border-color: var(--brass); background: var(--panel-2); }
  .tab:focus-visible{ outline: 2px solid var(--brass); outline-offset: 2px; }

  /* Exercise ledger */
  .ledger{ border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .exercise{
    border-bottom: 1px solid var(--line); padding: 14px 16px; background: var(--panel);
  }
  .exercise:last-child{ border-bottom: none; }
  .ex-head{ display:flex; align-items:flex-start; gap: 12px; }
  .ex-icon{
    flex-shrink:0; width:46px; height:46px; border-radius:50%;
    background: var(--panel-2); border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .ex-icon svg{ width:32px; height:32px; display:block; }
  .icon-line{ fill:none; stroke: var(--brass); stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; }
  .icon-head{ fill: var(--brass); }
  .icon-dash{ fill:none; stroke: var(--chalk-dim); stroke-width:1.6; stroke-linecap:round; stroke-dasharray:3 3; }
  .icon-ball{ fill: var(--panel); stroke: var(--line); stroke-width:1.4; }

  .anim-swing{ animation: swing 1.8s ease-in-out infinite; }
  .anim-bob{ animation: bob 1.8s ease-in-out infinite; }
  .anim-reach{ animation: reach 1.8s ease-in-out infinite; }
  .anim-pulse{ animation: pulse 1.6s ease-in-out infinite; }
  @keyframes swing{
    0%   { transform: rotate(0deg); }
    50%  { transform: rotate(var(--swing, 12deg)); }
    100% { transform: rotate(0deg); }
  }
  @keyframes bob{
    0%   { transform: translateY(0px); }
    50%  { transform: translateY(var(--bob, 6px)); }
    100% { transform: translateY(0px); }
  }
  @keyframes reach{
    0%, 100% { transform: translateX(0px); }
    50%      { transform: translateX(var(--reach, 6px)); }
  }
  @keyframes pulse{
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }
  @media (prefers-reduced-motion: reduce){
    .anim-swing, .anim-bob, .anim-reach, .anim-pulse{ animation: none; }
  }
  .ex-text{ flex: 1; min-width: 0; }
  .ex-title-row{ display:flex; justify-content:space-between; align-items:baseline; gap: 10px; flex-wrap:wrap; }
  .ex-name{ font-weight: 600; font-size: 0.98rem; }
  .ex-meta{ font-family:'IBM Plex Mono',monospace; font-size: 0.76rem; color: var(--chalk-dim); white-space:nowrap; }
  .shoulder-tag{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size: 0.68rem;
    color: var(--rust); border: 1px solid var(--rust); border-radius: var(--radius);
    padding: 1px 6px; margin-left: 8px; vertical-align: middle;
  }
  .ex-note{ color: var(--chalk-dim); font-size: 0.8rem; margin-top: 4px; }
  .desc-toggle{
    background: none; border: none; color: var(--brass); font-family:'IBM Plex Mono',monospace;
    font-size: 0.72rem; cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 2px;
  }
  .ex-desc{ color: var(--chalk-dim); font-size: 0.82rem; margin-top: 4px; display: none; line-height: 1.4; }
  .ex-desc.open{ display: block; }

  .sets{ margin-top: 10px; display:flex; flex-direction:column; gap:6px; }
  .set-row{ display:flex; align-items:center; gap: 8px; font-family:'IBM Plex Mono',monospace; font-size: 0.8rem; }
  .set-row .set-idx{ width: 20px; color: var(--chalk-dim); }
  .set-row input[type=number]{
    width: 64px; background: var(--bg); border: 1px solid var(--line); color: var(--chalk);
    border-radius: var(--radius); padding: 5px 6px; font-family: inherit; font-size: 0.8rem;
  }
  .set-row label.unit{ color: var(--chalk-dim); }
  .set-row .done{
    margin-left: auto; width: 22px; height: 22px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--bg); cursor:pointer;
    display:flex; align-items:center; justify-content:center; color: var(--olive); font-size: 0.9rem;
  }
  .set-row .done.checked{ background: rgba(138,154,111,0.18); border-color: var(--olive); }

  .day-actions{ display:flex; justify-content:space-between; align-items:center; margin: 16px 0 26px; gap: 10px; flex-wrap:wrap; }
  .save-btn{
    background: var(--brass); color: #211a12; border:none; font-weight:600;
    padding: 10px 18px; border-radius: var(--radius); cursor: pointer; font-family: inherit; font-size: 0.86rem;
  }
  .save-btn:hover{ background: #c99a6b; }
  .save-btn:focus-visible{ outline: 2px solid var(--chalk); outline-offset:2px; }
  .last-saved{ font-family:'IBM Plex Mono',monospace; font-size: 0.74rem; color: var(--chalk-dim); }

  /* History */
  section.block{ margin-bottom: 30px; }
  .block h2{ font-size: 1rem; margin: 0 0 10px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .history-item{
    border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 8px;
    background: var(--panel); font-size: 0.82rem;
  }
  .history-item .h-date{ font-family:'IBM Plex Mono',monospace; color: var(--brass); font-size: 0.76rem; margin-bottom: 4px; }
  .history-item .h-line{ color: var(--chalk-dim); }
  .empty{ color: var(--chalk-dim); font-size: 0.84rem; font-style: italic; }

  /* Metrics */
  .metrics-form{ display:flex; gap: 10px; flex-wrap: wrap; align-items:flex-end; margin-bottom: 14px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size: 0.72rem; color: var(--chalk-dim); font-family:'IBM Plex Mono',monospace; }
  .field input{
    background: var(--panel); border: 1px solid var(--line); color: var(--chalk);
    border-radius: var(--radius); padding: 7px 9px; font-family:'IBM Plex Mono',monospace; font-size: 0.84rem; width: 110px;
  }
  .metrics-form button{
    background: var(--panel-2); color: var(--chalk); border: 1px solid var(--brass);
    padding: 8px 14px; border-radius: var(--radius); cursor: pointer; font-family: inherit; font-size: 0.82rem;
  }
  .metrics-form button:hover{ background: var(--brass); color:#211a12; }

  .metric-row{
    display:grid; grid-template-columns: 90px 60px 60px 1fr; gap: 10px; align-items:center;
    font-family:'IBM Plex Mono',monospace; font-size: 0.78rem; padding: 7px 0; border-bottom: 1px solid var(--line);
  }
  .metric-row:last-child{ border-bottom:none; }
  .bar-track{ background: var(--bg); border-radius: var(--radius); height: 8px; overflow:hidden; }
  .bar-fill{ height: 100%; background: var(--brass); }

  footer{ text-align:center; color: var(--chalk-dim); font-size: 0.72rem; margin-top: 30px; font-family:'IBM Plex Mono',monospace; }

  .ex-icon{ cursor: pointer; }
  .icon-overlay{
    position: fixed; inset: 0; background: rgba(15,14,13,0.97);
    display: none; align-items: center; justify-content: center; flex-direction: column;
    z-index: 999; padding: 24px;
  }
  .icon-overlay.open{ display: flex; }
  .icon-overlay svg{ width: min(60vw, 280px); height: min(60vw, 280px); }
  .icon-overlay .ov-name{ margin-top: 18px; font-weight: 600; font-size: 1.05rem; text-align: center; }
  .icon-overlay .ov-desc{ color: var(--chalk-dim); font-size: 0.85rem; text-align: center; margin-top: 8px; max-width: 320px; line-height: 1.5; }
  .icon-overlay .ov-close{
    position: absolute; top: max(20px, env(safe-area-inset-top)); right: 20px;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--line); color: var(--chalk);
    font-size: 1.1rem; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .backup-row{ display:flex; justify-content:center; gap: 10px; margin-top: 14px; }
  .backup-btn{
    background: var(--panel); color: var(--chalk-dim); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 7px 12px; font-family:'IBM Plex Mono',monospace;
    font-size: 0.72rem; cursor: pointer;
  }
  .backup-btn:hover{ border-color: var(--brass); color: var(--chalk); }
  .version-tag{ margin-top: 10px; opacity: 0.6; }

  @media (max-width: 480px){
    .masthead{ flex-direction:column; align-items:flex-start; }
    .tab{ min-width: 44%; }
    .set-row input[type=number]{ width: 54px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>Caderno de Treino</h1>
      <div class="sub">Mauro De Grande Jr · plano de 24 semanas</div>
    </div>
    <div class="phase-select">
      <span>FASE</span>
      <select id="phaseSelect">
        <option value="1">1 — Fundação (sem 1–4)</option>
        <option value="2">2 — Hipertrofia (sem 5–12)</option>
        <option value="3">3 — Intensificação (sem 13–20)</option>
        <option value="4">4 — Reforço + Deload (sem 21–24)</option>
      </select>
    </div>
  </div>

  <div class="phase-note" id="phaseNote"></div>

  <div class="tabs" id="dayTabs"></div>

  <div class="phase-note" id="extraNote"></div>

  <div class="ledger" id="ledger"></div>

  <div class="day-actions">
    <button class="save-btn" id="saveBtn">Salvar treino de hoje</button>
    <span class="last-saved" id="lastSaved"></span>
  </div>

  <section class="block">
    <h2>Histórico deste dia</h2>
    <div id="history"></div>
  </section>

  <section class="block">
    <h2>Reavaliação corporal</h2>
    <div class="metrics-form">
      <div class="field">
        <label for="mWeight">PESO (KG)</label>
        <input type="number" step="0.1" id="mWeight" placeholder="71.2">
      </div>
      <div class="field">
        <label for="mBf">GORDURA (%)</label>
        <input type="number" step="0.1" id="mBf" placeholder="19.9">
      </div>
      <button id="mSaveBtn">Registrar</button>
    </div>
    <div id="metricsHistory"></div>
  </section>

  <footer>
    Dados salvos apenas neste dispositivo · ajuste cargas com base na sensação real de cada sessão
    <div class="backup-row">
      <button id="exportBtn" class="backup-btn">Exportar backup</button>
      <button id="importBtn" class="backup-btn">Importar backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
    <div class="version-tag" id="versionTag"></div>
  </footer>
</div>

<div class="icon-overlay" id="iconOverlay">
  <div class="ov-close" id="ovClose">✕</div>
  <div id="ovSvgWrap"></div>
  <div class="ov-name" id="ovName"></div>
  <div class="ov-desc" id="ovDesc"></div>
</div>

<script>
(function(){

  const APP_VERSION = "2.0.0";
  const STORAGE_KEY = "mauro-tracker-data";

  const DAYS = {
    A: {
      label: "Costas + Bíceps",
      exercises: [
        { name: "Elástico ombro em \"U\"", icon: "elastic_u", sets: 2, unit: "reps", meta: "12 reps · desc. 45s", note: "Elástico na parede na altura da testa, cotovelos fixos na altura do ombro. Seu exercício favorito de pré-hab.", shoulder: true, desc: "Cotovelos fixos na altura dos ombros, antebraço a 90°. Suba as mãos de frente do corpo até ficarem acima da cabeça." },
        { name: "Face pull (cabo/elástico leve)", icon: "face_pull", sets: 3, unit: "reps", meta: "15 reps · desc. 60s", note: "Prioridade máxima para o ombro.", shoulder: true, desc: "Puxe a corda/elástico em direção ao rosto, abrindo os cotovelos para fora e para cima." },
        { name: "Puxada frontal (Lat Pulldown)", icon: "lat_pulldown", sets: 3, unit: "reps", meta: "12 reps · desc. 90s", desc: "Sentado, puxe a barra de cima para baixo até a altura do peito, cotovelos para baixo." },
        { name: "Remada baixa (cabo sentado)", icon: "row", sets: 3, unit: "reps", meta: "12 reps · desc. 90s", note: "Foco em retração escapular.", desc: "Sentado, puxe o cabo horizontalmente até o abdômen, apertando as escápulas no final." },
        { name: "Remada serrote unilateral (halter)", icon: "serrote", sets: 3, unit: "reps", meta: "12 cada braço · desc. 60s", note: "Do seu treino antigo — ótimo trabalho unilateral de costas.", desc: "Apoiado com um joelho e mão no banco, puxe o halter com o outro braço em direção ao quadril." },
        { name: "Rosca direta (barra EZ)", icon: "bicep_curl", sets: 2, unit: "reps", meta: "12 reps · desc. 60s", desc: "Em pé, flexione os cotovelos elevando a barra até a altura do ombro." },
        { name: "Rotação de tronco", icon: "torso_rotation", sets: 3, unit: "reps", meta: "15 reps · desc. 45s", desc: "Em pé, gire o tronco de um lado para o outro de forma controlada, sem mover o quadril." },
        { name: "Passeio com o Cachorro — Mobilidade de Ombro", icon: "dog_walk", sets: 3, unit: "min", noWeight: true, meta: "~30 min cada · sem equipamento", note: "Durante o passeio: rotação de braços em círculo (15–20 voltas cada direção) + retração escapular (espremer as escápulas por 2s) a cada poste/quarteirão.", desc: "Durante o passeio: rotação de braços em círculo + retração escapular a cada poste/quarteirão." }
      ]
    },
    B: {
      label: "Pernas (Quad) + Tríceps",
      exercises: [
        { name: "Band pull-apart", icon: "band_pull_apart", sets: 2, unit: "reps", meta: "15 reps · desc. 45s", desc: "Elástico esticado na horizontal na altura do peito; afaste as mãos abrindo os braços para os lados." },
        { name: "Wall slides (escada sueca)", icon: "wall_slides", sets: 2, unit: "reps", meta: "10 reps · desc. 45s", desc: "Costas na parede, braços em \"W\" deslizando para cima em \"Y\", mantendo contato com a parede." },
        { name: "Leg Press / Agachamento", icon: "squat_press", sets: 3, unit: "reps", meta: "10 reps · desc. 2min", desc: "Empurre a plataforma com as pernas (ou agache com peso nas costas) até quase 90° no joelho." },
        { name: "Cadeira extensora", icon: "leg_extension", sets: 3, unit: "reps", meta: "12 reps · desc. 60s", desc: "Sentado, estenda os joelhos contra a resistência até as pernas ficarem retas." },
        { name: "Mesa flexora", icon: "leg_curl", sets: 3, unit: "reps", meta: "12 reps · desc. 60s", desc: "Deitado de bruços, flexione os joelhos puxando o peso com os calcanhares." },
        { name: "Panturrilha em pé", icon: "calf_raise", sets: 3, unit: "reps", meta: "15 reps · desc. 45s", desc: "Eleve os calcanhares o máximo possível e desça controlado." },
        { name: "Tríceps corda (cabo)", icon: "tricep_pushdown", sets: 2, unit: "reps", meta: "12 reps · desc. 60s", desc: "Em pé, estenda os cotovelos empurrando a corda para baixo, abrindo as mãos no final." },
        { name: "Pallof press (cabo)", icon: "pallof", sets: 2, unit: "reps", meta: "12 cada lado · desc. 45s", desc: "De lado para o cabo, empurre-o à frente do corpo resistindo à rotação que ele causa." },
        { name: "Passeio com o Cachorro — Ritmo Acelerado", icon: "dog_walk", sets: 3, unit: "min", noWeight: true, meta: "~30 min cada · zona 2", note: "1 passeio em ritmo acelerado 20–25min (cardio do dia). Nas pausas do cachorro: elevação de calcanhar, 10–15 reps.", desc: "1 passeio em ritmo acelerado (zona 2) por 20-25min + elevação de calcanhar nas pausas." }
      ]
    },
    C: {
      label: "Peito + Ombro",
      exercises: [
        { name: "Rotação externa no cabo/faixa", icon: "ext_rotation", sets: 3, unit: "reps", meta: "15 reps · desc. 45s", note: "Cotovelo fixo no tronco — exercício-chave de pré-hab.", shoulder: true, desc: "Cotovelo fixo ao lado do corpo, gire o antebraço para fora contra a resistência." },
        { name: "Rotação interna no cabo/faixa", icon: "int_rotation", sets: 3, unit: "reps", meta: "15 reps · desc. 45s", note: "Par completo do manguito rotador junto com a externa.", shoulder: true, desc: "Cotovelo fixo ao lado do corpo, gire o antebraço para dentro contra a resistência." },
        { name: "Chest Press (máquina)", icon: "chest_press_machine", sets: 3, unit: "reps", meta: "10 reps · desc. 90s", note: "Amplitude controlada.", desc: "Sentado, empurre os handles para a frente do peito até os braços quase estenderem." },
        { name: "Supino inclinado com halteres", icon: "incline_press", sets: 3, unit: "reps", meta: "10 reps · desc. 90s", note: "Amplitude controlada — evite alongamento extremo do ombro.", shoulder: true, desc: "Deitado em banco inclinado (~30°), empurre os halteres para cima até quase estender os braços." },
        { name: "Pullover com halter", icon: "pullover", sets: 2, unit: "reps", meta: "12 reps · desc. 60s", desc: "Deitado, segure um halter com as duas mãos acima da cabeça e desça em arco até sentir alongar o peito, depois retorne." },
        { name: "Desenvolvimento c/ halteres, sentado", icon: "shoulder_press", sets: 2, unit: "reps", meta: "12 reps · desc. 90s", note: "Amplitude parcial — não descer abaixo da linha das orelhas.", shoulder: true, desc: "Sentado, empurre os halteres para cima acima da cabeça, sem descer abaixo da linha das orelhas." },
        { name: "Elevação lateral (halteres leves)", icon: "lateral_raise", sets: 3, unit: "reps", meta: "15 reps · desc. 45s", note: "Peso baixo, foco em controle.", shoulder: true, desc: "Em pé, eleve os halteres lateralmente até a altura do ombro, cotovelos levemente flexionados." },
        { name: "Prancha abdominal", icon: "plank", sets: 3, unit: "seg", meta: "30–40s · desc. 45s", desc: "Apoiado nos antebraços e pontas dos pés, mantenha o corpo reto sem deixar o quadril cair." },
        { name: "Passeio com o Cachorro — Postura Ativa", icon: "dog_walk", sets: 3, unit: "min", noWeight: true, meta: "~30 min cada · sem equipamento", note: "Caminhar com ombros para trás, peito aberto, core ativo. Nas pausas: alongamento de peito, mãos entrelaçadas atrás das costas, 20–30s.", desc: "Caminhe com ombros para trás e peito aberto + alongamento de peito nas pausas." }
      ]
    },
    D: {
      label: "Pernas (Posterior/Glúteo)",
      exercises: [

  const PHASE_NOTES = {
    "1": "<b>Fundação:</b> RPE alvo 6–7 (deixe 3–4 reps na reserva). Prioridade total em técnica e reaprendizado motor.",
    "2": "<b>Hipertrofia:</b> some 1 série por exercício principal a cada 2 semanas. RPE alvo 7–8.",
    "3": "<b>Intensificação:</b> drop-set na última série de 1–2 exercícios por treino. RPE alvo 8–9.",
    "4": "<b>Reforço + Deload:</b> sem 21–23 mantenha intensidade com leve corte de volume; sem 24 é deload total (50% do volume, cargas leves)."
  };

  let state = { logs: { A: [], B: [], C: [], D: [] }, metrics: [], phase: "1" };
  let currentDay = "A";

  async function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        state = Object.assign(state, parsed);
      }
    }catch(e){ /* sem dados ainda, mantém padrão */ }
    document.getElementById('phaseSelect').value = state.phase || "1";
    document.getElementById('versionTag').textContent = 'v' + APP_VERSION;
    render();
  }

  async function persist(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){ console.error('Falha ao salvar (armazenamento cheio ou bloqueado)', e); }
  }

  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const today = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = 'backup-caderno-treino-' + today + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });

  document.getElementById('importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try{
        const parsed = JSON.parse(evt.target.result);
        if(!parsed.logs || !parsed.metrics){ throw new Error('formato inválido'); }
        state = Object.assign({ logs: { A: [], B: [], C: [], D: [] }, metrics: [], phase: "1" }, parsed);
        persist();
        document.getElementById('phaseSelect').value = state.phase || "1";
        render();
        alert('Backup importado com sucesso.');
      }catch(err){
        alert('Não foi possível importar este arquivo. Verifique se é um backup válido deste app.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  function renderTabs(){
    const tabsEl = document.getElementById('dayTabs');
    tabsEl.innerHTML = '';
    Object.keys(DAYS).forEach(key => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (key === currentDay ? ' active' : '');
      btn.innerHTML = '<span class="letter">DIA ' + key + '</span><span class="label">' + DAYS[key].label + '</span>';
      btn.addEventListener('click', () => { currentDay = key; render(); });
      tabsEl.appendChild(btn);
    });
  }

  const STATIC_STRETCH = "<b>Alongamento estático (início da sessão, mesma sequência todos os dias, ~5min):</b> panturrilha na parede → posterior de coxa → quadríceps em pé → quadril (afundo estático) → peitoral na porta/parede → pescoço/trapézio lateral, ~20-30s cada.";
  const EXTRA_TIP = " <span style=\"opacity:0.85\">A mobilidade de ombro já está na ficha abaixo, junto com a força. O passeio com o cachorro de hoje também está na ficha, com a sugestão do dia.</span>";

  function renderExtraNote(){
    document.getElementById('extraNote').innerHTML = STATIC_STRETCH + EXTRA_TIP;
  }

  function renderPhaseNote(){
    document.getElementById('phaseNote').innerHTML = PHASE_NOTES[state.phase || "1"];
  }

  const SUGGESTED_DEFAULTS = {
    A: {
      "Elástico ombro em \"U\"": { weight: 2, reps: 12 },
      "Face pull (cabo/elástico leve)": { weight: 8, reps: 15 },
      "Puxada frontal (Lat Pulldown)": { weight: 19, reps: 12 },
      "Remada baixa (cabo sentado)": { weight: 19, reps: 12 },
      "Remada serrote unilateral (halter)": { weight: 11, reps: 12 },
      "Rosca direta (barra EZ)": { weight: 11, reps: 12 },
      "Rotação de tronco": { reps: 15 }
    },
    B: {
      "Band pull-apart": { reps: 15 },
      "Wall slides (escada sueca)": { reps: 10 },
      "Leg Press / Agachamento": { weight: 50, reps: 10 },
      "Cadeira extensora": { weight: 16, reps: 12 },
      "Mesa flexora": { weight: 13, reps: 12 },
      "Panturrilha em pé": { reps: 15 },
      "Tríceps corda (cabo)": { weight: 13, reps: 12 },
      "Pallof press (cabo)": { weight: 7, reps: 12 }
    },
    C: {
      "Rotação externa no cabo/faixa": { weight: 2, reps: 15 },
      "Rotação interna no cabo/faixa": { weight: 2, reps: 15 },
      "Chest Press (máquina)": { weight: 19, reps: 10 },
      "Supino inclinado com halteres": { weight: 8, reps: 10 },
      "Pullover com halter": { weight: 8, reps: 12 },
      "Desenvolvimento c/ halteres, sentado": { weight: 5.5, reps: 12 },
      "Elevação lateral (halteres leves)": { weight: 3.5, reps: 15 }
    },
    D: {
      "Rotação interna no cabo/faixa": { weight: 2, reps: 15 },
      "Elástico ombro em \"U\"": { weight: 2, reps: 12 },
      "Stiff com barra": { weight: 17, reps: 10 },
      "Stiff unilateral (halter)": { weight: 6, reps: 10 },
      "Afundo búlgaro (banco + halteres)": { weight: 5.5, reps: 10 },
      "Elevação pélvica": { weight: 11, reps: 12 },
      "Abdominal com pernas em tabletop (90°)": { reps: 15 }
    }
  };

  function getLastValue(day, exerciseName, setIdx, field){
    const entries = state.logs[day] || [];
    for(let i = entries.length - 1; i >= 0; i--){
      const match = entries[i].exercises.find(e => e.name === exerciseName);
      if(match && match.sets[setIdx] && match.sets[setIdx][field] != null){
        return match.sets[setIdx][field];
      }
    }
    const fallback = (SUGGESTED_DEFAULTS[day] || {})[exerciseName];
    return fallback && fallback[field] != null ? fallback[field] : null;
  }

  function renderLedger(){
    const ledgerEl = document.getElementById('ledger');
    ledgerEl.innerHTML = '';
    DAYS[currentDay].exercises.forEach((ex, exIdx) => {
      const exEl = document.createElement('div');
      exEl.className = 'exercise';
      let head = '<div class="ex-head">' +
        '<div class="ex-icon" data-icon="' + (ex.icon || '') + '" data-name="' + ex.name.replace(/"/g, '&quot;') + '" data-desc="' + (ex.desc ? ex.desc.replace(/"/g, '&quot;') : '') + '">' + (ICONS[ex.icon] || '') + '</div>' +
        '<div class="ex-text">' +
          '<div class="ex-title-row"><span class="ex-name">' + ex.name +
          (ex.shoulder ? '<span class="shoulder-tag" title="Cuidado com o ombro esquerdo neste exercício">⚠ OMBRO</span>' : '') +
          '</span><span class="ex-meta">' + ex.meta + '</span></div>' +
          (ex.note ? '<div class="ex-note">' + ex.note + '</div>' : '') +
          (ex.desc ? '<button class="desc-toggle" type="button">Como fazer ▾</button><div class="ex-desc">' + ex.desc + '</div>' : '') +
        '</div>' +
      '</div>';
      exEl.innerHTML = head;

      const setsEl = document.createElement('div');
      setsEl.className = 'sets';
      for(let s = 0; s < ex.sets; s++){
        const row = document.createElement('div');
        row.className = 'set-row';
        row.dataset.ex = exIdx;
        row.dataset.set = s;
        const unitLabel = ex.unit === 'seg' ? 'seg' : (ex.unit === 'min' ? 'min' : 'reps');
        const lastWeight = getLastValue(currentDay, ex.name, s, 'weight');
        const lastReps = getLastValue(currentDay, ex.name, s, 'reps');
        const weightAttr = (lastWeight != null) ? (' value="' + lastWeight + '"') : '';
        const repsAttr = (lastReps != null) ? (' value="' + lastReps + '"') : '';
        row.innerHTML = ex.noWeight ?
          ('<span class="set-idx">' + (s+1) + '</span>' +
          '<input type="number" class="r-input" placeholder="' + unitLabel + '"' + repsAttr + '>' +
          '<label class="unit">' + unitLabel + '</label>' +
          '<span class="done" role="button" tabindex="0" aria-label="Marcar passeio concluído">✓</span>')
          :
          ('<span class="set-idx">' + (s+1) + '</span>' +
          '<input type="number" class="w-input" placeholder="kg" step="0.5"' + weightAttr + '>' +
          '<label class="unit">kg</label>' +
          '<input type="number" class="r-input" placeholder="' + unitLabel + '"' + repsAttr + '>' +
          '<label class="unit">' + unitLabel + '</label>' +
          '<span class="done" role="button" tabindex="0" aria-label="Marcar série concluída">✓</span>');
        setsEl.appendChild(row);
      }
      exEl.appendChild(setsEl);
      ledgerEl.appendChild(exEl);
    });

    ledgerEl.querySelectorAll('.done').forEach(btn => {
      btn.addEventListener('click', () => btn.classList.toggle('checked'));
      btn.addEventListener('keypress', (e) => { if(e.key === 'Enter' || e.key === ' ') btn.classList.toggle('checked'); });
    });

    ledgerEl.querySelectorAll('.desc-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const descEl = btn.nextElementSibling;
        const isOpen = descEl.classList.toggle('open');
        btn.textContent = isOpen ? 'Como fazer ▴' : 'Como fazer ▾';
      });
    });

    ledgerEl.querySelectorAll('.ex-icon').forEach(iconEl => {
      iconEl.addEventListener('click', () => {
        const key = iconEl.dataset.icon;
        document.getElementById('ovSvgWrap').innerHTML = ICONS[key] || '';
        document.getElementById('ovName').textContent = iconEl.dataset.name || '';
        document.getElementById('ovDesc').textContent = iconEl.dataset.desc || '';
        document.getElementById('iconOverlay').classList.add('open');
      });
    });
  }

  function renderHistory(){
    const histEl = document.getElementById('history');
    const entries = (state.logs[currentDay] || []).slice(-6).reverse();
    if(entries.length === 0){
      histEl.innerHTML = '<div class="empty">Nenhum treino registrado ainda para o Dia ' + currentDay + '.</div>';
      return;
    }
    histEl.innerHTML = entries.map(entry => {
      const lines = entry.exercises.map(e => {
        const doneSets = e.sets.filter(s => s.done);
        if(doneSets.length === 0) return null;
        const detail = doneSets.map(s => s.weight != null ? (s.weight + 'kg×' + (s.reps ?? '—')) : ((s.reps ?? '—') + 'min')).join(', ');
        return e.name + ': ' + detail;
      }).filter(Boolean);
      return '<div class="history-item"><div class="h-date">' + entry.date + '</div>' +
        (lines.length ? lines.map(l => '<div class="h-line">' + l + '</div>').join('') : '<div class="h-line">Sessão registrada sem séries marcadas.</div>') +
        '</div>';
    }).join('');
  }

  function renderLastSaved(){
    const entries = state.logs[currentDay] || [];
    const last = entries[entries.length - 1];
    document.getElementById('lastSaved').textContent = last ? ('último registro: ' + last.date) : '';
  }

  function renderMetrics(){
    const wrap = document.getElementById('metricsHistory');
    const list = (state.metrics || []).slice(-6);
    if(list.length === 0){
      wrap.innerHTML = '<div class="empty">Sem registros ainda. Reavalie a cada ~4 semanas.</div>';
      return;
    }
    const weights = list.map(m => m.weight).filter(w => typeof w === 'number');
    const min = Math.min(...weights), max = Math.max(...weights);
    const range = (max - min) || 1;
    wrap.innerHTML = list.slice().reverse().map(m => {
      const pct = weights.length > 1 ? ((m.weight - min) / range) * 70 + 25 : 60;
      return '<div class="metric-row"><span>' + m.date + '</span><span>' + (m.weight ?? '—') + 'kg</span><span>' +
        (m.bf ?? '—') + '%</span><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div></div>';
    }).join('');
  }

  function render(){
    renderTabs();
    renderPhaseNote();
    renderExtraNote();
    renderLedger();
    renderHistory();
    renderLastSaved();
    renderMetrics();
  }

  document.getElementById('phaseSelect').addEventListener('change', (e) => {
    state.phase = e.target.value;
    renderPhaseNote();
    persist();
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const today = new Date().toISOString().slice(0,10);
    const existingIdx = state.logs[currentDay].findIndex(entry => entry.date === today);

    if(existingIdx !== -1){
      const confirmOverwrite = confirm('Você já registrou o treino de hoje para este dia. Quer sobrescrever o registro existente?');
      if(!confirmOverwrite) return;
    }

    const exercisesData = DAYS[currentDay].exercises.map((ex, exIdx) => {
      const setRows = document.querySelectorAll('.set-row[data-ex="' + exIdx + '"]');
      const sets = Array.from(setRows).map(row => ({
        weight: row.querySelector('.w-input') ? (row.querySelector('.w-input').value ? parseFloat(row.querySelector('.w-input').value) : null) : null,
        reps: row.querySelector('.r-input').value ? parseFloat(row.querySelector('.r-input').value) : null,
        done: row.querySelector('.done').classList.contains('checked')
      }));
      return { name: ex.name, sets };
    });

    if(existingIdx !== -1){
      state.logs[currentDay][existingIdx] = { date: today, exercises: exercisesData };
    } else {
      state.logs[currentDay].push({ date: today, exercises: exercisesData });
      if(state.logs[currentDay].length > 30) state.logs[currentDay].shift();
    }
    persist();
    renderHistory();
    renderLastSaved();
  });

  document.getElementById('mSaveBtn').addEventListener('click', () => {
    const w = document.getElementById('mWeight').value;
    const bf = document.getElementById('mBf').value;
    if(!w && !bf) return;
    const today = new Date().toISOString().slice(0,10);
    state.metrics.push({ date: today, weight: w ? parseFloat(w) : null, bf: bf ? parseFloat(bf) : null });
    persist();
    document.getElementById('mWeight').value = '';
    document.getElementById('mBf').value = '';
    renderMetrics();
  });

  document.getElementById('ovClose').addEventListener('click', () => {
    document.getElementById('iconOverlay').classList.remove('open');
  });
  document.getElementById('iconOverlay').addEventListener('click', (e) => {
    if(e.target.id === 'iconOverlay') document.getElementById('iconOverlay').classList.remove('open');
  });

  loadState();

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(err => {
        console.warn('Service worker não registrado:', err);
      });
    });
  }
})();

</script>
</body>
</html>
